name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Typecheck, lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        # Non-bloquant pour l'instant : ~130 erreurs de lint pré-existantes
        # (sans rapport avec les changements en cours) traînent dans le repo.
        # On garde le rapport visible dans les logs sans faire échouer la CI
        # pour ça — à retirer une fois ce passif nettoyé (voir
        # docs/schema-audit.md pour le contexte des chantiers PWA en cours).
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          # Dummy values are enough here: Vite only needs the vars to exist
          # at build time to bake them into the bundle, the build does not
          # actually contact Supabase.
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key

  isolation:
    name: Isolation multi-locataire
    runs-on: ubuntu-latest
    # Ce job est bloquant : une fuite de donnees entre deux clients est le seul
    # defaut qui condamne le produit. Voir docs/saas-strategie-produit.md § 4.1.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Installer le client psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Rejouer les migrations et verifier le cloisonnement
        run: ./scripts/test-tenant-isolation.sh
        env:
          PGTEST_HOST: localhost
          PGTEST_PORT: 5433
          PGPASSWORD: postgres
